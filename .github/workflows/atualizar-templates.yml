name: Sincronizar Templates em Toda a Organização
on:
  push:
    branches: [ main ] # Roda sempre que você atualizar os templates comuns no modelo

# Duas alternativas para o futuro
#Permite que você clique em um botão e rode o script a hora que quiser (Manual)
  # workflow_dispatch: 
    #Intrução de como dispatch funciona:
    #Vá no seu repositório modelo e clique na aba Actions
    #Na barra lateral esquerda, clique no nome do seu workflow: "Sincronizar Templates em Toda a Org".
    #Um aviso cinza vai aparecer na tela com um botão chamado Run workflow (Executar fluxo de trabalho).
    #Clique nele, escolha a branch (main) e clique no botão verde. O robô vai rodar na mesma hora.

# Roda automaticamente às 00:00 do primeiro dia de cada mês (Mensal)
  #schedule:
  #  - cron: '0 0 1 * *'
  
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descobrir e Atualizar Todos os Repositórios
        env:
          # O token administrativo que você cadastrou nas configurações do modelo
          PAT_TOKEN: ${{ secrets.ORGANIZATION_ADMIN_TOKEN }} 
        run: |
          # 1. Pega o nome da Organização atual automaticamente
          ORG_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f1)
          MODEL_REPO=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)

          echo "Buscando repositórios da organização: $ORG_NAME"

          # 2. Pergunta ao GitHub quais repositórios existem (traz até 100 por página)
          REPOS=$(curl -s -H "Authorization: token $PAT_TOKEN" \
            "https://github.com" | jq -r '.[].name')

          # 3. Roda a atualização em cada um deles
          for REPO in $REPOS; do
            # Pula o próprio repositório modelo para não dar conflito infinito
            if [ "$REPO" = "$MODEL_REPO" ]; then continue; fi
            
            echo "Processando repositório: $REPO"
            
            # Tenta clonar. Se der erro (ex: falta de permissão), pula para o próximo
            git clone https://$PAT_TOKEN@://github.com || continue
            
            # Garante que a pasta de templates existe no destino
            mkdir -p $REPO/.github/ISSUE_TEMPLATE/
            
            # Copia os templates comuns sem apagar o que o desenvolvedor criou de específico lá
            cp .github/ISSUE_TEMPLATE/* $REPO/.github/ISSUE_TEMPLATE/
            
            cd $REPO
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git add .github/ISSUE_TEMPLATE/
            
            # Se houver mudanças, envia a atualização. Se não houver, não faz nada.
            git diff-index --quiet HEAD || (git commit -m "Chore: Atualizar templates de issue comuns" && git push)
            cd ..
            rm -rf $REPO
          done
